<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG卡牌管理工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#6366f1',
          secondary: '#8b5cf6',
          accent: '#14b8a6',
          success: '#22c55e',
          warning: '#f59e0b',
          error: '#ef4444',
          info: '#3b82f6',
          dark: '#0f172a',
          'dark-light': '#1e293b',
          'dark-lighter': '#334155',
          light: '#f8fafc',
          'light-dark': '#e2e8f0',
          'light-darker': '#cbd5e1'
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          display: ['Poppins', 'sans-serif']
        },
        boxShadow: {
          'card': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
          'card-hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
          'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.37)',
          'inner-glow': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.06)'
        },
        backgroundImage: {
          'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
          'gradient-conic': 'conic-gradient(from 180deg at 50% 50%, var(--tw-gradient-stops))'
        }
      }
    }
  }
</script>
<style type="text/tailwindcss">
  @layer utilities {
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: var(--tw-shadow-glass);
    }
    .dark .glass {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .glass-strong {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .dark .glass-strong {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    
    .hover-scale {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hover-scale:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .text-gradient {
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .bg-blur {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    
    .animate-bounce-slow {
      animation: bounce-slow 2s ease-in-out infinite;
    }
    
    @keyframes bounce-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    
    .animate-pulse-slow {
      animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    .animate-shake {
      animation: shake 0.5s ease-in-out;
    }
    
    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
    }
    
    .animate-jump {
      animation: jump 0.6s ease-in-out;
    }
    
    @keyframes jump {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.1); }
    }
    
    .animate-shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    .card-border {
      position: relative;
      border-radius: 0.75rem;
      overflow: hidden;
    }
    
    .card-border::before {
      content: '';
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: 0.75rem;
      background: linear-gradient(45deg, var(--tw-gradient-stops));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: subtract;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }
    
    .scrollbar-hidden::-webkit-scrollbar {
      display: none;
    }
    
    .scrollbar-hidden {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  }
</style>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    font-family: 'Inter', 'Microsoft YaHei', sans-serif;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  
  .modal {
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }
  
  .modal.active {
    opacity: 1;
    visibility: visible;
  }
  
  .modal-content {
    transform: translateY(-20px);
    transition: transform 0.3s ease;
  }
  
  .modal.active .modal-content {
    transform: translateY(0);
  }
  
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    transform: translateX(400px);
    transition: transform 0.3s ease;
  }
  
  .toast.show {
    transform: translateX(0);
  }
  
  .table-container {
    max-height: 60vh;
    overflow-y: auto;
  }
  
  .table-container::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  
  .table-container::-webkit-scrollbar-track {
    background: transparent;
  }
  
  .table-container::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 3px;
  }
  
  .table-container::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
  
  /* 移动端底部导航 */
  @media (max-width: 1024px) {
    .mobile-nav {
      display: flex !important;
    }
    .desktop-sidebar {
      display: none !important;
    }
    .main-content {
      padding-bottom: 80px;
    }
  }
  
  @media (min-width: 1025px) {
    .mobile-nav {
      display: none !important;
    }
    .desktop-sidebar {
      display: block !important;
    }
  }
  
  .drag-handle {
    cursor: grab;
  }
  
  .drag-handle:active {
    cursor: grabbing;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .fade-in {
    animation: fadeIn 0.3s ease;
  }
  
  .pulse {
    animation: pulse 2s infinite;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
</style>
</head>
<body class="bg-light dark:bg-dark text-gray-800 dark:text-gray-200 min-h-screen">
  <!-- 顶部导航栏 -->
  <header id="mainHeader" class="bg-gradient-to-r from-primary via-secondary to-accent text-white shadow-xl relative overflow-hidden">
    <!-- 背景装饰 -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_20%_80%,rgba(255,255,255,0.15),transparent_50%)]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_80%_20%,rgba(255,255,255,0.1),transparent_50%)]"></div>
    
    <div class="container mx-auto px-4 py-3 relative z-10">
      <div class="flex items-center justify-between gap-4">
        <!-- 左侧：Logo和标题 -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center border border-white/30 shadow-lg animate-float">
            <i class="fa fa-gamepad text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl md:text-2xl font-bold font-display tracking-tight">
              <span class="text-gradient bg-gradient-to-r from-white to-blue-100">TCG卡牌管理</span>
            </h1>
            <p class="text-xs text-white/70 flex items-center gap-1.5">
              <span>犀牛的TCG笔记</span>
              <img src="avatar.jpg" alt="头像" class="w-5 h-5 rounded-full border border-white/30 object-cover">
            </p>
          </div>
        </div>
        
        <!-- 右侧：搜索和设置 -->
        <div class="flex items-center gap-2">
          <div class="relative" data-tooltip="输入卡牌名称或编号进行搜索，支持实时筛选显示结果。">
            <input type="text" id="search" oninput="performSearch()" placeholder="搜索..." class="bg-white/20 backdrop-blur-sm border border-white/30 rounded-lg pl-8 pr-7 py-1.5 text-sm w-36 md:w-48 focus:ring-2 focus:ring-white/50 focus:border-white focus:outline-none placeholder-white/50">
            <i class="fa fa-search absolute left-2.5 top-1/2 transform -translate-y-1/2 text-white/60 text-xs"></i>
            <button id="clearSearch" onclick="clearSearch()" class="hidden absolute right-2 top-1/2 transform -translate-y-1/2 text-white/60 hover:text-white transition-colors" data-tooltip="清空搜索框内容，显示所有卡牌。">
              <i class="fa fa-times-circle text-xs"></i>
            </button>
          </div>
          
          <!-- 背景切换按钮 -->
          <button onclick="changeBackground()" 
                  class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center hover:scale-110 transition-transform"
                  title="切换网页背景">
            <i class="fa fa-image text-white text-sm"></i>
          </button>
          
          <!-- 使用说明按钮 -->
          <button onclick="showHelp()" 
                  class="w-8 h-8 bg-white/20 backdrop-blur-sm rounded-lg flex items-center justify-center hover:bg-white/30 transition-colors"
                  title="使用说明">
            <i class="fa fa-question-circle text-white text-sm"></i>
          </button>
          
          <button onclick="showBgColorPicker()" class="bg-white/20 backdrop-blur-sm p-1.5 rounded-lg hover:bg-white/30 transition-colors" data-tooltip="自定义首页背景颜色主题。提供多种渐变配色方案可供选择。">
            <i class="fa fa-paint-brush text-white text-sm"></i>
          </button>
          
          <button id="cloudStorageBtn" onclick="showCloudStorageConfig()" class="bg-white/20 backdrop-blur-sm p-1.5 rounded-lg hover:bg-white/30 transition-colors" data-tooltip="配置云存储备份，将图片同步到 GitHub 仓库。">
            <i class="fa fa-cloud-upload text-white text-sm"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 统计卡片 -->
  <div class="main-content container mx-auto px-4 py-2">
    <div class="grid grid-cols-3 gap-2 mb-3">
      <!-- 总卡牌数 -->
      <div class="bg-white dark:bg-gray-800 rounded-xl p-3 shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-0.5 border border-gray-100 dark:border-gray-700" data-tooltip="显示当前收藏中所有卡牌的总数量（按实际张数计算，包含重复卡牌）。">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-medium">总卡牌数</p>
            <h3 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mt-0.5" id="totalCount">0</h3>
          </div>
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
            <i class="fa fa-clone text-white text-sm"></i>
          </div>
        </div>
      </div>
      
      <!-- 总价值 -->
      <div class="bg-white dark:bg-gray-800 rounded-xl p-3 shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-0.5 border border-gray-100 dark:border-gray-700" data-tooltip="所有卡牌按当前选中货币计算的总价值。自动根据汇率换算。">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-medium">总价值</p>
            <h3 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mt-0.5">
              <span id="totalPrice">0</span> <span id="curLabel" class="text-sm text-gray-400">CNY</span>
            </h3>
          </div>
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center shadow-lg shadow-emerald-500/30">
            <i class="fa fa-money text-white text-sm"></i>
          </div>
        </div>
      </div>
      
      <!-- 汇率信息 -->
      <div class="bg-white dark:bg-gray-800 rounded-xl p-3 shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-0.5 border border-gray-100 dark:border-gray-700" data-tooltip="选择不同的货币查看对应汇率。所有价格会自动按当前汇率换算显示。">
        <div class="flex items-center justify-between">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 mb-0.5">
              <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-medium">当前汇率</p>
              <select id="currencySel" onchange="changeCurrency()" class="text-[10px] bg-gray-100 dark:bg-gray-700 border-0 rounded px-1.5 py-0.5 cursor-pointer focus:ring-1 focus:ring-orange-400 text-gray-700 dark:text-gray-300 font-medium">
                <option value="CNY">CNY</option>
                <option value="USD">USD</option>
                <option value="JPY">JPY</option>
                <option value="KRW">KRW</option>
                <option value="SGD">SGD</option>
                <option value="MYR">MYR</option>
                <option value="THB">THB</option>
              </select>
            </div>
            <h3 class="text-sm font-bold text-gray-800 dark:text-gray-100 truncate" id="exchangeRate">1 CNY = 1 CNY</h3>
            <p class="text-[10px] text-gray-400 truncate" id="rateUpdateTime">基准货币：人民币</p>
          </div>
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center shadow-lg shadow-orange-500/30 flex-shrink-0">
            <i class="fa fa-exchange text-white text-sm"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 主要内容区域 -->
  <div class="container mx-auto px-4">
    <div class="flex flex-col lg:flex-row gap-4">
      <!-- 左侧功能按钮栏 -->
      <div class="desktop-sidebar lg:w-[160px] flex-shrink-0">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-2.5 border border-gray-100 dark:border-gray-700 sticky top-3">
          <!-- 核心操作 -->
          <div class="mb-2">
            <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold mb-1.5 px-1">核心操作</p>
            <button id="addBtn" onclick="openAddCardModal()" data-tooltip="添加新的卡牌到收藏库中。点击后填写卡牌信息（名称、编号、类型、价格等）并保存。" class="w-full bg-gradient-to-r from-primary to-secondary hover:opacity-90 text-white px-2 py-1.5 rounded-lg text-xs transition-all duration-200 flex items-center gap-1.5 mb-1 shadow-sm shadow-primary/30">
              <i class="fa fa-plus text-[10px]"></i> 新增卡牌
            </button>
          </div>
          
          <!-- 数据管理 -->
          <div class="mb-2">
            <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold mb-1.5 px-1">数据管理</p>
            <div class="grid grid-cols-2 gap-1">
              <button id="exportBtn" onclick="exportToExcel()" data-tooltip="将所有卡牌数据导出为Excel文件，方便备份或在其他设备上使用。" class="bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 text-blue-600 dark:text-blue-400 px-2 py-1.5 rounded-lg text-[10px] transition-colors flex flex-col items-center gap-0.5">
                <i class="fa fa-download text-xs"></i> 导出
              </button>
              <button id="importBtn" onclick="importFromExcel()" data-tooltip="从Excel文件导入卡牌数据。选择之前导出的文件即可恢复数据。" class="bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50 text-blue-600 dark:text-blue-400 px-2 py-1.5 rounded-lg text-[10px] transition-colors flex flex-col items-center gap-0.5">
                <i class="fa fa-upload text-xs"></i> 导入
              </button>
            </div>
          </div>
          
          <!-- 分组管理 -->
          <div class="mb-2">
            <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold mb-1.5 px-1">分组管理</p>
            <div class="grid grid-cols-2 gap-1">
              <button id="mergeGroupBtn" onclick="showMergeGroupManager()" data-tooltip="合并子集功能。可以将选中的卡牌归集到一个自定义分组中，方便管理和查看。" class="bg-purple-50 dark:bg-purple-900/30 hover:bg-purple-100 dark:hover:bg-purple-900/50 text-purple-600 dark:text-purple-400 px-2 py-1.5 rounded-lg text-[10px] transition-colors flex flex-col items-center gap-0.5">
                <i class="fa fa-object-group text-xs"></i> 合并
              </button>
              <button id="groupManagerBtn" onclick="showGroupManager()" data-tooltip="查看和管理所有分组。可以查看分组内的卡牌、删除分组等。" class="bg-indigo-50 dark:bg-indigo-900/30 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 px-2 py-1.5 rounded-lg text-[10px] transition-colors flex flex-col items-center gap-0.5">
                <i class="fa fa-folder-open text-xs"></i> 分组
              </button>
            </div>
          </div>
          
          <!-- 工具 -->
          <div class="mb-2">
            <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold mb-1.5 px-1">工具</p>
            <div class="grid grid-cols-2 gap-1">
              <button id="statsBtn" onclick="showStats()" data-tooltip="查看卡牌收藏的统计信息，包括各类别分布、价值分析等图表。" class="bg-emerald-50 dark:bg-emerald-900/30 hover:bg-emerald-100 dark:hover:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400 px-2 py-1.5 rounded-lg text-[10px] transition-colors flex flex-col items-center gap-0.5">
                <i class="fa fa-bar-chart text-xs"></i> 统计
              </button>
              <button id="historyBtn" onclick="showHistory()" data-tooltip="查看所有操作历史记录，包括添加、编辑、删除等操作的详细日志。" class="bg-amber-50 dark:bg-amber-900/30 hover:bg-amber-100 dark:hover:bg-amber-900/50 text-amber-600 dark:text-amber-400 px-2 py-1.5 rounded-lg text-[10px] transition-colors flex flex-col items-center gap-0.5">
                <i class="fa fa-history text-xs"></i> 历史
              </button>
              <button id="shareBtn" onclick="showShareCard()" data-tooltip="生成收益分享卡片，向朋友展示你的卡牌投资收益情况。" class="bg-purple-50 dark:bg-purple-900/30 hover:bg-purple-100 dark:hover:bg-purple-900/50 text-purple-600 dark:text-purple-400 px-2 py-1.5 rounded-lg text-[10px] transition-colors flex flex-col items-center gap-0.5">
                <i class="fa fa-share-alt text-xs"></i> 晒收益
              </button>
            </div>
          </div>
          
          <!-- 删除管理 -->
          <div>
            <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold mb-1.5 px-1">删除管理</p>
            <div class="grid grid-cols-2 gap-1">
              <button id="batchDeleteBtn" onclick="batchDeleteOrClear()" data-tooltip="批量删除卡牌或清空所有数据。勾选卡牌后点击可批量删除，未勾选时点击可清空全部。" class="bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 px-2 py-1.5 rounded-lg text-[10px] transition-colors flex flex-col items-center gap-0.5">
                <i class="fa fa-trash text-xs"></i> 删除
              </button>
              <button id="deletedCardsBtn" onclick="showDeletedCardsManager()" data-tooltip="点击进入已删除卡牌管理界面，在里面可以操作所有被删除的卡牌，包括查看详情、恢复卡牌或彻底删除。" class="bg-orange-50 dark:bg-orange-900/30 hover:bg-orange-100 dark:hover:bg-orange-900/50 text-orange-600 dark:text-orange-400 px-2 py-1.5 rounded-lg text-[10px] transition-colors flex flex-col items-center gap-0.5">
                <i class="fa fa-trash-o text-xs"></i> 已删
              </button>
            </div>
          </div>
          

        </div>
      </div>
      
      <!-- 中间卡牌列表 -->
      <div class="card-list-area flex-1 min-w-0">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm overflow-hidden border border-gray-100 dark:border-gray-700">
          <!-- 表头工具栏 -->
          <div class="p-3 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-gray-50/50 dark:bg-gray-700/50">
            <div class="flex items-center gap-2">
              <h2 class="text-base font-semibold flex items-center gap-2 text-gray-800 dark:text-gray-200">

    elements.closeToast.onclick = function() {

    const header = document.getElementById('mainHeader');
    if (header) {
      header.className = `bg-gradient-to-r ${savedBgColor} text-white shadow-xl relative overflow-hidden`;
    }

  render();

  updateDeletedCount();
  
  // 初始化数据库（只调用一次），确保完成后再初始化文件系统

}

    showToast('提示', '图片存储文件夹已设置，所有图片将保存在本地', 'success');
    return;

  // 只显示提示信息，不自动弹出文件夹选择（受浏览器安全限制）

  }
}

// === 切换云存储开关 ===
function toggleCloudStorage() {
  const enabled = document.getElementById('cloudEnabled').checked;
  document.getElementById('cloudConfigFields').style.display = enabled ? 'block' : 'none';
  cloudStorageConfig.enabled = enabled;
  saveCloudStorageConfig();
}

// === 保存云存储配置 ===
function saveCloudStorageConfig() {
  if (document.getElementById('cloudToken')) {
    cloudStorageConfig.token = document.getElementById('cloudToken').value;
    cloudStorageConfig.owner = document.getElementById('cloudOwner').value;
    cloudStorageConfig.repo = document.getElementById('cloudRepo').value;
    cloudStorageConfig.branch = document.getElementById('cloudBranch').value;
  }
  localStorage.setItem('cloudStorageConfig', JSON.stringify(cloudStorageConfig));
  updateCloudStorageButton();
}

// === 测试云存储连接 ===
async function testCloudStorage() {
  saveCloudStorageConfig();
  
  if (!cloudStorageConfig.token || !cloudStorageConfig.owner || !cloudStorageConfig.repo) {
    showToast('错误', '请填写完整的配置信息', 'error');
    return;
  }
  
  try {
    showToast('提示', '正在测试连接...', 'info');
    
    const url = `https://api.github.com/repos/${cloudStorageConfig.owner}/${cloudStorageConfig.repo}`;
    const response = await fetch(url, {
      headers: {
        'Authorization': `token ${cloudStorageConfig.token}`
      }
    });
    
    if (response.ok) {
      showToast('成功', '✅ 连接成功！云存储已配置', 'success');
      cloudStorageConfig.enabled = true;
      saveCloudStorageConfig();
    } else {
      const error = await response.json();
      showToast('错误', `连接失败: ${error.message || '未知错误'}`, 'error');
    }
  } catch (e) {
    showToast('错误', `连接失败: ${e.message}`, 'error');
  }
}

// === 上传图片到 GitHub ===
async function uploadImageToGitHub(file, fileName) {
  if (!cloudStorageConfig.enabled || !cloudStorageConfig.token) {
    return false;
  }
  
  try {
    const arrayBuffer = await file.arrayBuffer();
    const base64 = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
    
    const path = `tcg-card-images/${fileName}`;
    const url = `https://api.github.com/repos/${cloudStorageConfig.owner}/${cloudStorageConfig.repo}/contents/${path}`;
    
    // 先检查文件是否已存在
    const checkResponse = await fetch(url, {
      headers: {
        'Authorization': `token ${cloudStorageConfig.token}`
      }
    });
    
    let payload = {
      message: `上传卡牌图片: ${fileName}`,
      content: base64,
      branch: cloudStorageConfig.branch
    };
    
    if (checkResponse.ok) {
      const existing = await checkResponse.json();
      payload.sha = existing.sha;
    }
    
    const response = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${cloudStorageConfig.token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });
    
    if (response.ok) {
      console.log('[DEBUG] GitHub 上传成功:', fileName);
      return true;
    } else {
      const error = await response.json();
      console.error('[DEBUG] GitHub 上传失败:', error.message);
      return false;
    }
  } catch (e) {
    console.error('[DEBUG] GitHub 上传异常:', e);
    return false;
  }
}

// === IndexedDB 初始化（只调用一次）===
async function initDB() {
  const DB_NAME = 'TCGCardDB';
  const DB_VERSION = 2;
  
  // 检查现有数据库版本，如果版本过高（之前的bug导致），删除重建
  const databases = await indexedDB.databases();
  const existingDb = databases.find(db => db.name === DB_NAME);
  
  if (existingDb && existingDb.version > 10) {
    console.log('[DIAG] initDB - 检测到版本过高:', existingDb.version, '删除重建');
    await new Promise((resolve, reject) => {
      const deleteReq = indexedDB.deleteDatabase(DB_NAME);
      deleteReq.onsuccess = () => {
        console.log('[DIAG] initDB - 旧数据库已删除');
        resolve();
      };
      deleteReq.onerror = () => {
        console.error('[DIAG] initDB - 删除旧数据库失败');
        resolve(); // 继续尝试打开
      };
    });
  }
  
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    
    request.onerror = () => {
      console.error('[DIAG] initDB - 打开失败:', request.error);
      reject(request.error);
    };
    
    request.onupgradeneeded = (event) => {
      console.log('[DIAG] initDB - onupgradeneeded:', event.oldVersion, '→', event.newVersion);
      const db = event.target.result;
      
      if (!db.objectStoreNames.contains('directoryHandles')) {
        db.createObjectStore('directoryHandles');
        console.log('[DIAG] initDB - 创建 store: directoryHandles');
      }
      
      if (!db.objectStoreNames.contains('images')) {
        db.createObjectStore('images');
        console.log('[DIAG] initDB - 创建 store: images');
      }
    };
    
    request.onsuccess = () => {
      cardDB = request.result;
      console.log('[DIAG] initDB - 成功! 版本:', cardDB.version, 'stores:', Array.from(cardDB.objectStoreNames));
      
      // 添加 get/put/delete 方法
      cardDB.get = function(storeName, key) {
        return new Promise((res, rej) => {
          const tx = cardDB.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.get(key);
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        });
      };
      
      cardDB.put = function(storeName, value, key) {
        return new Promise((res, rej) => {
          const tx = cardDB.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.put(value, key);
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        });
      };
      
      cardDB.delete = function(storeName, key) {
        return new Promise((res, rej) => {
          const tx = cardDB.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.delete(key);
          req.onsuccess = () => res();
          req.onerror = () => rej(req.error);
        });
      };
      
      resolve(cardDB);
    };
  });
}

// === 获取数据库连接（自动初始化）===
async function getDB() {
  if (!cardDB) {
    await initDB();
  }
  return cardDB;
}

// === 保存图片（混合存储：文件系统 + IndexedDB 备份）===
async function saveImageToFile(file, fileName, showNotification = false) {
  console.log('[DEBUG] saveImageToFile - 开始保存图片:', { useFileSystem, imageDirectoryHandle, fileName });
  
  // 检查文件是否有效
  if (!file || file.size === 0) {
    console.error('[DIAG] saveImageToFile - 无效文件，跳过保存:', fileName);
    throw new Error('文件为空或无效');
  }
  
  // 首先备份到 IndexedDB（无论文件系统是否可用）
  await saveImageToIndexedDB(file, fileName);
  
  // 如果文件系统可用，同时保存到本地文件夹
  let localSaved = false;
  if (useFileSystem && imageDirectoryHandle) {
    // 检查文件是否为空
    if (!file || file.size === 0) {
      console.error('[DIAG] saveImageToFile - 文件为空，跳过文件系统保存');
    } else {
      console.log('[DIAG] saveImageToFile - 开始文件系统保存流程');
      try {
        console.log('[DIAG] saveImageToFile - 步骤1: 获取文件句柄');
        const fileHandle = await imageDirectoryHandle.getFileHandle(fileName, { create: true });
        console.log('[DIAG] saveImageToFile - 步骤2: 创建可写流');
        const writable = await fileHandle.createWritable();
        console.log('[DIAG] saveImageToFile - 步骤3: 写入文件内容, size:', file.size);
        await writable.write(file);
        console.log('[DIAG] saveImageToFile - 步骤4: 关闭流');
        await writable.close();
        console.log('[DIAG] saveImageToFile - 文件系统保存成功:', fileName);
        localSaved = true;
        
        if (showNotification) {
          showToast('成功', '✅ 图片已保存到本地文件夹', 'success');
        }
      } catch (e) {
        console.error('[DIAG] saveImageToFile - 文件系统保存失败:', e.name, e.message);
        // 文件夹保存失败不影响主流程，图片已备份到 IndexedDB
        if (showNotification) {
          showToast('提示', '图片已保存到浏览器缓存中', 'info');
        }
      }
    }
  } else {
    // 文件系统不可用，仅保存到 IndexedDB
    if (showNotification) {
      showToast('提示', '📁 图片已保存到浏览器缓存中。设置本地文件夹可永久保存图片', 'info');
    }
  }
  
  // 如果云存储已配置，同时上传到 GitHub（不阻塞主流程）
  if (cloudStorageConfig.enabled && cloudStorageConfig.token) {
    uploadImageToGitHub(file, fileName).then((success) => {
      if (success) {
        console.log('[DEBUG] saveImageToFile - 图片已备份到 GitHub');
      }
    }).catch((e) => {
      console.error('[DEBUG] saveImageToFile - GitHub 备份失败:', e);
    });
  }
  
  return fileName;
}

function getCategoryHistory() {
  return JSON.parse(localStorage.getItem('tcgCategoryHistory')) || [];
}

// === 保存分类历史记录 ===
function saveCategoryHistory(category) {
  if (!category) return;
  let history = getCategoryHistory();
  // 去重并添加到开头
  history = history.filter(c => c !== category);
  history.unshift(category);
  // 只保留最近20个
  history = history.slice(0, 20);
  localStorage.setItem('tcgCategoryHistory', JSON.stringify(history));
}

// === 生成分类选项HTML ===
function generateCategoryOptions(selectedValue) {
  const defaultCategories = ['宝可梦', 'OPCG', '游戏王', '黑白双翼'];
  const history = getCategoryHistory();
  // 过滤掉默认分类中已存在的
  const filteredHistory = history.filter(h => !defaultCategories.includes(h));
  const allCategories = [...defaultCategories, ...filteredHistory];
  
  const isCustom = selectedValue && !defaultCategories.includes(selectedValue);
  
  let options = allCategories.map(cat => 
    `<option value="${cat}" ${selectedValue === cat ? 'selected' : ''}>${cat}</option>`
  ).join('');
  
  options += `<option value="other" ${isCustom ? 'selected' : ''}>其他（自定义）</option>`;
  
  return options;
}

}

// === 显示系列下拉列表 ===
function showSeriesDropdown() {
  const dropdown = document.getElementById('seriesDropdown');
  const history = getSeriesHistory();
  renderSeriesDropdown(history);
  dropdown.classList.remove('hidden');
}

// === 渲染系列下拉列表 ===
function renderSeriesDropdown(items) {
  const dropdown = document.getElementById('seriesDropdown');
  if (items.length === 0) {
    dropdown.innerHTML = '<div class="px-3 py-2 text-gray-400 text-sm">暂无记录</div>';
    return;
  }
  dropdown.innerHTML = items.map((item, idx) => `
    <div class="flex items-center justify-between px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer border-b border-gray-100 dark:border-gray-700 last:border-0" onclick="selectSeries('${item.replace(/'/g, "\\'")}')">
      <span class="text-sm">${item}</span>
      <button onclick="event.stopPropagation(); deleteSeriesItem(${idx})" class="text-gray-400 hover:text-red-500 p-1">
        <i class="fa fa-times"></i>
      </button>
    </div>
  `).join('');
}

// === 筛选系列下拉列表 ===
function filterSeriesDropdown(value) {
  const history = getSeriesHistory();
  const filtered = history.filter(item => item.toLowerCase().includes(value.toLowerCase()));
  renderSeriesDropdown(filtered);
  document.getElementById('seriesDropdown').classList.remove('hidden');
}

// === 选择系列 ===
function selectSeries(value) {
  document.getElementById('cardSeries').value = value;
  document.getElementById('seriesDropdown').classList.add('hidden');
}

// === 删除系列历史记录项 ===
function deleteSeriesItem(index) {
  let history = getSeriesHistory();
  history.splice(index, 1);
  localStorage.setItem('tcgSeriesHistory', JSON.stringify(history));
  // 刷新下拉列表
  const currentValue = document.getElementById('cardSeries').value;
  filterSeriesDropdown(currentValue);
  showToast('成功', '已删除该记录');
}

// === 显示来源下拉列表 ===
function showSourceDropdown() {
  const dropdown = document.getElementById('sourceDropdown');
  const history = getSourceHistory();
  renderSourceDropdown(history);
  dropdown.classList.remove('hidden');
}

// === 渲染来源下拉列表 ===

  const dropdown = document.getElementById('sourceDropdown');
  if (items.length === 0) {
    dropdown.innerHTML = '<div class="px-3 py-2 text-gray-400 text-sm">暂无记录</div>';

    <div class="flex items-center justify-between px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer border-b border-gray-100 dark:border-gray-700 last:border-0" onclick="selectSource('${item.replace(/'/g, "\\'")}')">

  let history = getSourceHistory();
  history.splice(index, 1);
  localStorage.setItem('tcgSourceHistory', JSON.stringify(history));
  // 刷新下拉列表

// === 点击外部关闭下拉列表 ===
document.addEventListener('click', function(e) {
  const seriesInput = document.getElementById('cardSeries');
  const seriesDropdown = document.getElementById('seriesDropdown');
  const sourceInput = document.getElementById('cardSource');
  const sourceDropdown = document.getElementById('sourceDropdown');
  
  if (seriesDropdown && !seriesInput?.contains(e.target) && !seriesDropdown.contains(e.target)) {
    seriesDropdown.classList.add('hidden');
  }
  if (sourceDropdown && !sourceInput?.contains(e.target) && !sourceDropdown.contains(e.target)) {
    sourceDropdown.classList.add('hidden');
  }
});

// === 批量删除（首页删除按钮）===
function batchDeleteOrClear() {
  const checkboxes = document.querySelectorAll('.card-checkbox:checked');
  
  if (checkboxes.length === 0) {
    // 没有选中任何卡牌，提示用户先选择
    showToast('提示', '请先勾选要删除的卡牌', 'warning');
  } else {
    // 有选中的卡牌，执行批量标记删除
    const indices = Array.from(checkboxes).map(cb => parseInt(cb.dataset.id));
    
    // 过滤出未标记的卡牌（只处理未标记的）
    const unmarkedIndices = indices.filter(i => cards[i] && !cards[i].markedForDelete);
    
    if (unmarkedIndices.length === 0) {
      showToast('提示', '选中的卡牌已在"已删"列表中', 'warning');
      return;
    }
    
    if (confirm(`确定要删除选中的 ${unmarkedIndices.length} 张卡牌吗？删除后可在"已删"中查看和恢复。`)) {
      unmarkedIndices.forEach(index => {
        cards[index].markedForDelete = true;
      });
      
      save();
      render();
      updateDeletedCount();
      
      // 清空选择
      selectedCards.clear();
      document.getElementById('selectAll').checked = false;
      
      showToast('成功', `${unmarkedIndices.length}张卡牌已移至"已删"列表`);
    }
  }
}

// === 全选/取消全选 ===
function toggleSelectAll() {
  const selectAll = document.getElementById('selectAll');
  const checkboxes = document.querySelectorAll('.card-checkbox');
  
  // 如果是取消全选，直接执行
  if (!selectAll.checked) {
    checkboxes.forEach(cb => {
      cb.checked = false;
      selectedCards.delete(parseInt(cb.dataset.id));
    });
    return;
  }
  
  // 检查是否有标记的卡牌
  const markedIndices = [];
  const unmarkedIndices = [];
  
  checkboxes.forEach(cb => {
    const id = parseInt(cb.dataset.id);
    if (cards[id] && cards[id].markedForDelete) {
      markedIndices.push(id);
    } else {
      unmarkedIndices.push(id);
    }
  });
  
  // 如果没有标记的卡牌，直接全选
  if (markedIndices.length === 0) {
    checkboxes.forEach(cb => {
      cb.checked = true;
      selectedCards.add(parseInt(cb.dataset.id));
    });
    return;
  }
  
  // 有标记的卡牌，显示自定义确认对话框
  const content = `
    <div class="space-y-4">
      <p class="text-gray-700 dark:text-gray-300">检测到 <span class="text-red-500 font-bold">${markedIndices.length}</span> 张已标记删除的卡牌</p>
      <p class="text-sm text-gray-500 dark:text-gray-400">请选择要包含的卡牌：</p>
      <div class="flex flex-col gap-2">
        <button onclick="confirmSelectAll(false)" class="w-full bg-primary text-white py-3 px-4 rounded-lg hover:bg-primary/90 transition-colors flex items-center justify-center gap-2">
          <i class="fa fa-check-square-o"></i>
          仅选择未标记的卡牌 (${unmarkedIndices.length}张)
        </button>
        <button onclick="confirmSelectAll(true)" class="w-full bg-red-500 text-white py-3 px-4 rounded-lg hover:bg-red-600 transition-colors flex items-center justify-center gap-2">
          <i class="fa fa-exclamation-triangle"></i>
          选择所有卡牌 (包含${markedIndices.length}张已标记)
        </button>
        <button onclick="cancelSelectAll()" class="w-full bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 py-2 px-4 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 transition-colors">
          <i class="fa fa-times mr-1"></i>取消
        </button>
      </div>
    </div>
  `;
  
  showModal(content, '全选确认');
}

// 确认全选
function confirmSelectAll(includeMarked) {
  const checkboxes = document.querySelectorAll('.card-checkbox');
  
  checkboxes.forEach(cb => {
    const id = parseInt(cb.dataset.id);
    const card = cards[id];
    
    if (includeMarked) {
      // 选择所有
      cb.checked = true;
      selectedCards.add(id);
    } else {
      // 仅选择未标记的
      if (card && !card.markedForDelete) {
        cb.checked = true;
        selectedCards.add(id);
      } else {
        cb.checked = false;
        selectedCards.delete(id);
      }
    }
  });
  
  // 更新全选复选框状态
  const selectAll = document.getElementById('selectAll');
  if (!includeMarked) {
    // 如果没有全选，取消全选框的选中状态
    const unmarkedCount = cards.filter(c => !c.markedForDelete).length;
    selectAll.checked = unmarkedCount > 0;
  }
  
  closeModal();
  showToast('提示', includeMarked ? `已选择所有卡牌（含已标记）` : '已选择未标记的卡牌', 'info');
}

// 取消全选
function cancelSelectAll() {
  const selectAll = document.getElementById('selectAll');
  selectAll.checked = false;
  closeModal();
}

// === 排序 ===
function sortCards() {
  const sortSel = document.getElementById('sortSel');
  const sortType = sortSel.value;
  let sorted = [...cards];
  
  switch(sortType) {
    case 'name':
      sorted.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      break;
    case 'series':
      sorted.sort((a, b) => (a.series || '').localeCompare(b.series || ''));
      break;
    case 'source':
      sorted.sort((a, b) => (a.source || '').localeCompare(b.source || ''));
      break;
    case 'price-desc':
      sorted.sort((a, b) => (b.price || 0) - (a.price || 0));
      break;
    case 'price-asc':
      sorted.sort((a, b) => (a.price || 0) - (b.price || 0));
      break;
    case 'qty-desc':
      sorted.sort((a, b) => (b.qty || 0) - (a.qty || 0));
      break;
  }
  
  render(sorted);
}

// === 备份数据 ===
function backupData() {
  const data = {
    cards: cards,
    exportTime: new Date().toISOString(),
    version: '1.0'
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `TCG_Backup_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('成功', '数据已备份');
}

// === 恢复数据 ===
function restoreData() {
  document.getElementById('backupInput').click();
}

function handleBackupFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.cards && Array.isArray(data.cards)) {
        cards = data.cards;
        save();
        render();
        showToast('成功', '数据已恢复');
      } else {
        showToast('错误', '无效的备份文件', 'error');
      }
    } catch (err) {
      showToast('错误', '文件解析失败', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// === 确认合并分组 ===
function confirmMergeGroup() {
  const selectedRadio = document.querySelector('input[name="groupSelect"]:checked');
  const newGroupName = document.getElementById('newGroupName')?.value?.trim();
  
  let groupName = '';
  let isNewGroup = false;
  
  if (selectedRadio) {
    groupName = selectedRadio.value;
  } else if (newGroupName) {
    groupName = newGroupName;
    isNewGroup = true;
  } else {
    showToast('提示', '请选择或输入分组名称', 'warning');
    return;
  }
  
  // 获取现有分组
  let groups = JSON.parse(localStorage.getItem('tcgCardGroups')) || [];
  
  if (isNewGroup) {
    // 检查是否已存在同名分组
    if (groups.some(g => g.name === groupName)) {
      showToast('提示', '该分组名称已存在', 'warning');
      return;
    }
    // 创建新分组
    groups.push({
      name: groupName,
      cardIds: [],
      createdAt: Date.now()
    });
  }
  
  // 找到目标分组
  const targetGroup = groups.find(g => g.name === groupName);
  if (!targetGroup) {
    showToast('错误', '分组不存在', 'error');
    return;
  }
  
  // 将选中的卡牌添加到分组
  const selectedIndices = window.selectedMergeIndices || [];
  let addedCount = 0;
  
  selectedIndices.forEach(index => {
    const card = cards[index];
    if (card && !targetGroup.cardIds.includes(card.id || index)) {
      targetGroup.cardIds.push(card.id || index);
      // 给卡牌添加分组标记
      if (!card.groups) card.groups = [];
      if (!card.groups.includes(groupName)) {
        card.groups.push(groupName);
      }
      addedCount++;
    }
  });
  
  // 保存分组
  localStorage.setItem('tcgCardGroups', JSON.stringify(groups));
  save();
  
  // 清除选中状态
  document.querySelectorAll('.card-checkbox:checked').forEach(cb => cb.checked = false);
  updateBatchButton();
  
  closeModal();
  showToast('成功', `已将 ${addedCount} 张卡牌合并到「${groupName}」分组`);
  render();
}

// === 切换网页背景 ===
function changeBackground() {
  // 创建文件选择器
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const imageUrl = event.target.result;
        // 保存到localStorage
        localStorage.setItem('tcgCustomBackground', imageUrl);
        // 应用背景
        applyCustomBackground(imageUrl);
        showToast('成功', '背景图片已更换！', 'success');
      };
      reader.readAsDataURL(file);
    }
  };
  input.click();
}

// === 应用自定义背景 ===
function applyCustomBackground(imageUrl) {
  // 创建或更新背景层
  let bgLayer = document.getElementById('customBackgroundLayer');
  if (!bgLayer) {
    bgLayer = document.createElement('div');
    bgLayer.id = 'customBackgroundLayer';
    bgLayer.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity 0.5s ease;';
    document.body.insertBefore(bgLayer, document.body.firstChild);
  }
  bgLayer.style.backgroundImage = `url(${imageUrl})`;
  bgLayer.style.opacity = '1';
}

// === 移除自定义背景 ===
function removeCustomBackground() {
  localStorage.removeItem('tcgCustomBackground');
  const bgLayer = document.getElementById('customBackgroundLayer');
  if (bgLayer) {
    bgLayer.style.opacity = '0';
    setTimeout(() => bgLayer.remove(), 500);
  }
  showToast('提示', '已恢复默认背景', 'info');
}

function viewGroupCards(groupName) {

// === 从分组移除卡牌 ===
function removeCardFromGroup(groupName, cardIndex) {
  let groups = JSON.parse(localStorage.getItem('tcgCardGroups')) || [];
  const groupIndex = groups.findIndex(g => g.name === groupName);
  
  if (groupIndex === -1) return;
  
  const card = cards[cardIndex];
  if (card) {
    // 从分组中移除
    groups[groupIndex].cardIds = groups[groupIndex].cardIds.filter(id => id !== (card.id || cardIndex));
    // 从卡牌的分组列表中移除
    if (card.groups) {
      card.groups = card.groups.filter(g => g !== groupName);
    }
  }
  
  localStorage.setItem('tcgCardGroups', JSON.stringify(groups));
  save();
  
  showToast('成功', '已从分组中移除');
  viewGroupCards(groupName); // 刷新显示
}

// === 删除分组 ===
function deleteGroup(groupName) {
  if (!confirm(`确定要删除分组「${groupName}」吗？分组内的卡牌不会被删除。`)) {
    return;
  }
  
  let groups = JSON.parse(localStorage.getItem('tcgCardGroups')) || [];
  
  // 从所有卡牌中移除该分组标记
  cards.forEach(card => {
    if (card.groups) {
      card.groups = card.groups.filter(g => g !== groupName);
    }
  });
  
  // 删除分组
  groups = groups.filter(g => g.name !== groupName);
  
  localStorage.setItem('tcgCardGroups', JSON.stringify(groups));
  save();
  
  showToast('成功', '分组已删除');
  showGroupManager(); // 刷新显示
}

function copyShareText() {
  const activeCards = cards.filter(c => !c.markedForDelete);
  
  let totalPurchase = 0;
  let totalMarket = 0;
  let cardCount = 0;
  
  activeCards.forEach(card => {
    const qty = parseInt(card.qty) || 0;
    const purchaseQty = parseInt(card.purchaseQty) || 0;
    
    cardCount += qty;
    
    const purchasePrice = parseFloat(card.purchasePrice) || 0;
    const purchaseCurrency = card.purchaseCurrency || 'CNY';
    const marketPrice = parseFloat(card.marketPrice) || 0;
    const marketCurrency = card.marketCurrency || 'CNY';
    
    const purchaseInCNY = (purchaseCurrency === 'CNY' ? purchasePrice : purchasePrice / rate[purchaseCurrency]) * purchaseQty;
    const marketInCNY = (marketCurrency === 'CNY' ? marketPrice : marketPrice / rate[marketCurrency]) * qty;
    
    totalPurchase += purchaseInCNY;
    totalMarket += marketInCNY;
  });
  
  const profit = totalMarket - totalPurchase;
  const profitRate = totalPurchase > 0 ? (profit / totalPurchase * 100) : 0;
  
  const shareText = `🎴 我的TCG卡牌收藏收益
📊 收藏卡牌：${cardCount}张 / ${activeCards.length}种
💰 购入总价：¥${totalPurchase.toFixed(2)}
📈 市场估值：¥${totalMarket.toFixed(2)}
${profit >= 0 ? '✅' : '❌'} 投资收益：${profit >= 0 ? '+' : ''}¥${profit.toFixed(2)} (${profitRate >= 0 ? '+' : ''}${profitRate.toFixed(2)}%)

快来查看我的卡牌收藏！
https://goldxrhino.github.io/tcg-cards-manager/`;
  
  navigator.clipboard.writeText(shareText).then(() => {
    showToast('成功', '分享文案已复制');
  }).catch(() => {
    showToast('错误', '复制失败', 'error');

}

// 创建备份
function createBackup() {
  const name = prompt('请输入备份名称（可选）：', `备份_${new Date().toLocaleString()}`);
  if (name === null) return; // 用户取消
  
  const backup = {
    id: Date.now(),
    name: name || `备份_${new Date().toLocaleString()}`,
    timestamp: new Date().toISOString(),
    cardCount: cards.length,
    cards: [...cards],
    currency: currency,
    categoryHistory: JSON.parse(localStorage.getItem('tcgCategoryHistory')) || []
  };
  
  const backups = JSON.parse(localStorage.getItem('tcgBackups')) || [];
  backups.push(backup);
  
  // 限制备份数量（最多保留20个）
  if (backups.length > 20) {
    backups.shift();
  }
  
  localStorage.setItem('tcgBackups', JSON.stringify(backups));
  showToast('成功', '数据备份已创建');
  showBackupManager(); // 刷新界面
}

// 恢复备份
function restoreBackup(index) {
  const backups = JSON.parse(localStorage.getItem('tcgBackups')) || [];
  if (index < 0 || index >= backups.length) {
    showToast('错误', '备份不存在', 'error');
    return;
  }
  
  const backup = backups[index];
  
  if (!confirm(`确定要恢复到备份 "${backup.name}" 吗？\n当前数据将被覆盖！`)) {
    return;
  }
  
  // 二次确认
  if (!confirm('【二次确认】此操作将覆盖当前所有数据，确定要继续吗？')) {
    return;
  }
  
  // 恢复数据
  cards = [...backup.cards];
  currency = backup.currency || 'CNY';
  
  // 恢复分类历史
  if (backup.categoryHistory) {
    localStorage.setItem('tcgCategoryHistory', JSON.stringify(backup.categoryHistory));
  }
  
  // 保存到本地存储
  localStorage.setItem('tcgCards', JSON.stringify(cards));
  localStorage.setItem('tcgCurrency', currency);
  
  // 更新界面
  if (elements.currencySel) {
    elements.currencySel.value = currency;
  }
  render();
  updateDeletedCount();
  
  showToast('成功', '数据已从备份恢复');
  closeModal();
  addHistory('restore', `从备份恢复数据: ${backup.name}`, { backupId: backup.id });
}

// 下载备份文件
function downloadBackup(index) {
  const backups = JSON.parse(localStorage.getItem('tcgBackups')) || [];
  if (index < 0 || index >= backups.length) {
    showToast('错误', '备份不存在', 'error');
    return;
  }
  
  const backup = backups[index];
  const dataStr = JSON.stringify(backup, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement('a');
  a.href = url;
  a.download = `TCG备份_${backup.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_')}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  showToast('成功', '备份文件已下载');
}

// 删除备份
function deleteBackup(index) {
  const backups = JSON.parse(localStorage.getItem('tcgBackups')) || [];
  if (index < 0 || index >= backups.length) {
    showToast('错误', '备份不存在', 'error');
    return;
  }
  
  if (!confirm('确定要删除这个备份吗？')) {
    return;
  }
  
  backups.splice(index, 1);
  localStorage.setItem('tcgBackups', JSON.stringify(backups));
  showToast('成功', '备份已删除');
  showBackupManager(); // 刷新界面
}

// 从文件导入备份
function importBackupFromFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(event) {
      try {
        const backup = JSON.parse(event.target.result);
        
        // 验证备份格式
        if (!backup.cards || !Array.isArray(backup.cards)) {
          showToast('错误', '无效的备份文件格式', 'error');
          return;
        }
        
        if (!confirm(`确定要导入备份 "${backup.name || '未命名'}" 吗？\n当前数据将被覆盖！`)) {
          return;
        }
        
        // 二次确认
        if (!confirm('【二次确认】此操作将覆盖当前所有数据，确定要继续吗？')) {
          return;
        }
        
        // 恢复数据
        cards = [...backup.cards];
        currency = backup.currency || 'CNY';
        
        // 恢复分类历史
        if (backup.categoryHistory) {
          localStorage.setItem('tcgCategoryHistory', JSON.stringify(backup.categoryHistory));
        }
        
        // 保存到本地存储
        localStorage.setItem('tcgCards', JSON.stringify(cards));
        localStorage.setItem('tcgCurrency', currency);
        
        // 更新界面
        if (elements.currencySel) {
          elements.currencySel.value = currency;
        }
        render();
        updateDeletedCount();
        
        showToast('成功', '备份文件已导入并恢复');
        closeModal();
        addHistory('restore', `从文件导入备份: ${backup.name || '未命名'}`, { backupName: backup.name });
      } catch (err) {
        showToast('错误', '导入失败：' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

    });
    
    save();
    render();
    closeModal();

// === 更新库存和利润 ===
function updateStock() {
  const purchaseQtyInput = document.getElementById('cardPurchaseQty');
  const saleQtyInput = document.getElementById('cardSaleQty');
  const stockInput = document.getElementById('cardQty');
  const purchasePriceInput = document.getElementById('cardPurchasePrice');
  const purchaseCurrencySelect = document.getElementById('cardPurchaseCurrency');
  const salePriceInput = document.getElementById('cardSalePrice');
  const saleCurrencySelect = document.getElementById('cardSaleCurrency');
  const profitPreview = document.getElementById('profitPreview');
  
  // 更新库存
  if (purchaseQtyInput && saleQtyInput && stockInput) {
    const purchaseQty = parseInt(purchaseQtyInput.value) || 0;
    const saleQty = parseInt(saleQtyInput.value) || 0;
    const stock = purchaseQty - saleQty;
    
    stockInput.value = stock;
    
    // 根据库存状态改变样式
    if (stock < 0) {
      stockInput.className = 'w-full border rounded-lg px-3 py-2 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-sm cursor-not-allowed';
    } else if (stock === 0) {
      stockInput.className = 'w-full border rounded-lg px-3 py-2 bg-gray-100 dark:bg-gray-600 dark:border-gray-600 text-sm cursor-not-allowed';
    } else {
      stockInput.className = 'w-full border rounded-lg px-3 py-2 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 text-sm cursor-not-allowed';
    }
  }
  
  // 计算利润（基于数量）
  if (purchasePriceInput && salePriceInput && profitPreview) {
    const purchasePrice = parseFloat(purchasePriceInput.value) || 0;
    const purchaseCurrency = purchaseCurrencySelect ? purchaseCurrencySelect.value : 'CNY';
    const purchaseQty = parseInt(purchaseQtyInput.value) || 0;
    const salePrice = parseFloat(salePriceInput.value) || 0;
    const saleCurrency = saleCurrencySelect ? saleCurrencySelect.value : 'CNY';
    const saleQty = parseInt(saleQtyInput.value) || 0;
    
    // 统一转换为CNY计算（使用总价）
    const purchaseInCNY = (purchaseCurrency === 'CNY' ? purchasePrice : purchasePrice / rate[purchaseCurrency]) * purchaseQty;
    const saleInCNY = (saleCurrency === 'CNY' ? salePrice : salePrice / rate[saleCurrency]) * saleQty;
    
    const profit = saleInCNY - purchaseInCNY;
    
    // 显示利润
    if (profit > 0) {
      profitPreview.textContent = `+${currencySymbols['CNY']}${profit.toFixed(2)}`;
      profitPreview.className = 'w-full px-3 py-2 bg-green-100 dark:bg-green-900/30 rounded-lg text-sm text-green-600 dark:text-green-400 font-medium';
    } else if (profit < 0) {
      profitPreview.textContent = `${currencySymbols['CNY']}${profit.toFixed(2)}`;
      profitPreview.className = 'w-full px-3 py-2 bg-red-100 dark:bg-red-900/30 rounded-lg text-sm text-red-600 dark:text-red-400 font-medium';
    } else {
      profitPreview.textContent = `${currencySymbols['CNY']}0.00`;
      profitPreview.className = 'w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm text-gray-600 dark:text-gray-400';
    }
  }
}

// 关闭查价弹窗并恢复编辑界面
function closePriceCheckerAndRestore() {
  closeModal();
  // 恢复编辑界面
  if (editingCardIndex !== null && cards[editingCardIndex]) {
    // 如果是编辑模式，重新打开编辑界面
    setTimeout(() => {
      editCard(editingCardIndex);

    // 如果是新增模式，使用保存的数据重新打开新增界面
    setTimeout(() => {

    }, 100);
  }
}

// === 图片上传处理 ===
let currentImageBase64 = null;

function handleImageUpload(input) {
  const file = input.files[0];
  if (!file) return;
  
  // 检查文件类型
  if (!file.type.startsWith('image/')) {
    showToast('错误', '请选择图片文件', 'error');
    return;
  }
  
  // 检查文件大小（限制为 2MB）
  if (file.size > 2 * 1024 * 1024) {
    showToast('错误', '图片大小不能超过 2MB', 'error');
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    currentImageBase64 = e.target.result;
    updateImagePreview(currentImageBase64);
  };
  reader.readAsDataURL(file);
}

function updateImagePreview(base64Image) {
  const previewDiv = document.getElementById('imagePreview');
  if (!previewDiv) return;
  
  if (base64Image) {
    previewDiv.innerHTML = `<img src="${base64Image}" class="w-full h-full object-cover" alt="卡牌预览">`;
  } else {
    previewDiv.innerHTML = '<i class="fa fa-image text-gray-400 text-2xl"></i>';
  }
}

function clearImage() {
  currentImageBase64 = null;
  const fileInput = document.getElementById('cardImage');
  if (fileInput) fileInput.value = '';
  updateImagePreview(null);
}

// 生成唯一的文件名
function generateImageFileName(prefix = 'img') {
  const timestamp = Date.now();
  const random = Math.random().toString(36).substr(2, 9);
  return `${prefix}_${timestamp}_${random}.jpg`;
}

async function handleCardImagesUpload(input) {
  const files = Array.from(input.files);
  if (files.length === 0) return;
  
  // 不强制要求文件系统，图片会保存到 IndexedDB（如果文件系统可用也会保存到文件夹）
  await checkFileSystem(false);
  
  let savedCount = 0;
  for (const file of files) {
    // 检查文件类型
    if (!file.type.startsWith('image/')) {
      showToast('错误', '请选择图片文件', 'error');
      continue;
    }
    
    // 检查文件大小（限制为 10MB）
    if (file.size > 10 * 1024 * 1024) {
      showToast('错误', '图片大小不能超过 10MB', 'error');
      continue;
    }
    
    const fileName = generateImageFileName('card');
    
    try {
      await saveImageToFile(file, fileName, savedCount === 0); // 仅第一张图片显示通知
      cardImagesList.push(fileName);
      savedCount++;
      updateCardImagesPreview();
    } catch (e) {
      showToast('错误', '保存图片失败: ' + e.message, 'error');
      console.error(e);
    }
  }
  
  // 清空input以便可以重复选择相同文件
  input.value = '';
  
  if (savedCount > 1) {
    showToast('成功', `已添加 ${savedCount} 张图片`, 'success');
  }
}

  const files = Array.from(input.files);
  if (files.length === 0) return;
  
  const fsReady = await checkFileSystem();
  if (!fsReady) return;
  
  for (const file of files) {
    if (!file.type.startsWith('image/')) {
      showToast('错误', '请选择图片文件', 'error');
      continue;
    }
    if (file.size > 10 * 1024 * 1024) {
      showToast('错误', '图片大小不能超过 10MB', 'error');
      continue;

    const fileName = generateImageFileName('sv');
    try {

      await updateEditSubmittingVoucherPreview();
    } catch (e) {

  input.value = '';

function handleExcelFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  
  showToast('导入中', '正在读取文件...', 'info');
  
  const r = new FileReader();
  r.onload = function(ev) {
    try {
      const b = new Uint8Array(ev.target.result);
      const wb = XLSX.read(b, { type: 'array' });
      const arr = XLSX.utils.sheet_to_json(wb.Sheets.TCG);
      
      if (arr.length === 0) {
        showToast('错误', '文件中没有找到数据', 'error');
        return;
      }
      
      const importedCards = arr.map(x => ({
        name: x['名称'] || '',
        no: x['编号'] || '',
        cardType: x['类型'] || '裸卡',
        gradingOrg: x['评级机构'] || '',
        language: x['语言'] || '中文',
        source: x['来源'] || '',
        sourceLink: x['来源链接'] || '',
        purchaseTrackingNo: x['购入物流'] || '',
        saleTrackingNo: x['出售物流'] || '',
        markedForDelete: x['标记删除'] === '是' || false,
        qty: parseInt(x['数量']) || 1,
        purchaseQty: parseInt(x['购入数量']) || 0,
        saleQty: parseInt(x['出售数量']) || 0,
        purchasePrice: parseFloat(x['购入价']) || 0,
        purchaseCurrency: x['购入币种'] || 'CNY',
        marketPrice: parseFloat(x['市场价']) || 0,
        marketCurrency: x['市场币种'] || 'CNY',
        salePrice: parseFloat(x['出售价']) || 0,
        saleCurrency: x['出售币种'] || 'CNY',
        isInStock: x['是否入库'] === '是' || false,
        images: [],
        purchaseVouchers: [],
        saleVouchers: []
      })).filter(c => c.name);
      
      if (importedCards.length === 0) {
        showToast('错误', '没有找到有效的卡牌数据', 'error');
        return;
      }
      
      cards = importedCards;
      save();
      render();
      updateDeletedCount();
      showToast('成功', `成功导入 ${importedCards.length} 张卡牌`);
    } catch (err) {
      showToast('错误', '导入失败：' + err.message, 'error');
    }
    
    e.target.value = '';
  };
  
  r.onerror = function() {
    showToast('错误', '文件读取失败', 'error');
  };
  
  r.readAsArrayBuffer(f);
}

function save() {
  try {
    const data = JSON.stringify(cards);
    
    // 检查数据大小（localStorage 通常限制在 5-10MB）
    const dataSize = new Blob([data]).size;
    const maxSize = 4.5 * 1024 * 1024; // 4.5MB 安全限制
    
    if (dataSize > maxSize) {
      showToast('警告', `数据过大 (${(dataSize/1024/1024).toFixed(2)}MB)，建议删除一些图片或卡牌`, 'warning');
      console.warn('数据大小超过限制:', dataSize, 'bytes');
      return false;
    }
    
    localStorage.setItem('tcgCards', data);
    addHistory('save', '保存数据', { cards: [...cards] });
    return true;
  } catch (e) {
    if (e.name === 'QuotaExceededError') {
      showToast('错误', '存储空间已满！请删除一些卡牌或图片后再试', 'error');
      console.error('LocalStorage 配额超出:', e);
    } else {
      showToast('错误', '保存失败: ' + e.message, 'error');
      console.error('保存失败:', e);
    }
    return false;
  }
}

function addHistory(action, details, data = {}) {
  // 清除当前索引之后的历史记录
  if (historyIndex < operationHistory.length - 1) {
    operationHistory = operationHistory.slice(0, historyIndex + 1);
  }
  
  // 不存储完整数据，只存储引用和摘要，避免占用过多空间
  const historyEntry = {
    id: Date.now(),
    action,
    timestamp: new Date().toISOString(),
    details,
    dataSummary: data.cards ? { count: data.cards.length } : undefined
  };
  
  operationHistory.push(historyEntry);
  
  // 限制历史记录数量
  if (operationHistory.length > 20) {
    operationHistory.shift();
  }
  
  historyIndex = operationHistory.length - 1;
  
  try {
    localStorage.setItem('tcgHistory', JSON.stringify(operationHistory));
  } catch (e) {
    // 历史记录存储失败不影响主功能
    console.warn('历史记录保存失败:', e);
  }
}

// === 异步加载表格中的图片 ===
async function loadTableImages() {
  // 如果没有使用文件系统，先尝试初始化
  if (!useFileSystem) {
    await initFileSystem();
  }
  
  // 如果仍然没有使用文件系统，显示提示但继续尝试从 IndexedDB 加载
  if (!useFileSystem && cards.some(card => card.images && card.images.length > 0)) {
    setTimeout(() => {
      showToast('提示', '💡 图片将从浏览器缓存加载，设置本地文件夹可永久保存', 'info');
    }, 1000);
  }
  
  const placeholders = document.querySelectorAll('.image-placeholder[data-original-index]');
  
  // 并行加载所有图片，提高性能和可靠性
  const loadPromises = Array.from(placeholders).map(async (placeholder) => {
    const originalIndex = parseInt(placeholder.getAttribute('data-original-index'));
    const card = cards[originalIndex];
    if (!card) return;
    
    const fileName = card.images && card.images.length > 0 ? card.images[0] : card.image;
    if (!fileName) return;
    
    try {
      const imgSrc = await loadImageFromFile(fileName);
      if (imgSrc) {
        const img = document.createElement('img');
        img.src = imgSrc;
        img.className = 'w-7 h-9 object-cover rounded border border-gray-200 dark:border-gray-600 cursor-pointer hover:scale-150 transition-transform';
        img.onerror = function() {
          // 图片加载失败，显示占位符
          placeholder.innerHTML = '<div class="w-7 h-9 bg-gray-100 dark:bg-gray-700 rounded flex items-center justify-center"><i class="fa fa-image text-gray-300 text-[10px]"></i></div>';
        };
        
        placeholder.innerHTML = '';
        placeholder.appendChild(img);
        
        img.onclick = function() {
          openImagePreview(imgSrc);
        };
      } else {
        // 图片不存在，显示占位符
        placeholder.innerHTML = '<div class="w-7 h-9 bg-gray-100 dark:bg-gray-700 rounded flex items-center justify-center"><i class="fa fa-image text-gray-300 text-[10px]"></i></div>';
      }
    } catch (e) {
      console.error('加载图片失败:', fileName, e);
      // 加载出错，显示占位符
      placeholder.innerHTML = '<div class="w-7 h-9 bg-gray-100 dark:bg-gray-700 rounded flex items-center justify-center"><i class="fa fa-image text-gray-300 text-[10px]"></i></div>';
    }
  });
  
  // 等待所有图片加载完成（不阻塞）
  Promise.all(loadPromises).catch(e => {
    console.error('图片加载过程中出现错误:', e);
  });
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2);
}

// === 渲染卡牌列表 ===
function render(data = null) {
  const tbody = elements.body;
  const emptyState = document.getElementById('emptyState');
  if (!tbody) return;
  tbody.innerHTML = '';
  
  // 默认只显示未标记删除的卡牌
  const displayData = data || cards.filter(card => !card.markedForDelete);
  
  // 显示/隐藏空状态
  if (displayData.length === 0) {
    emptyState.classList.remove('hidden');
    // 重置统计数据
    elements.totalCount.textContent = '0';
    elements.totalPrice.textContent = '0.00';
    elements.cardListCount.textContent = '(0)';
    return;
  } else {
    emptyState.classList.add('hidden');
  }
  
  let totalQty = 0;
  let totalValue = 0;
  
  displayData.forEach((card, displayIndex) => {
    // 获取在原始cards数组中的真实索引
    const originalIndex = cards.indexOf(card);
    
    totalQty += parseInt(card.qty) || 0;
    totalValue += (parseFloat(card.purchasePrice) || 0) * (parseInt(card.purchaseQty) || 0);
    
    const tr = document.createElement('tr');
    // 斑马纹效果
    const isEven = displayIndex % 2 === 0;
    tr.className = `${isEven ? 'bg-white dark:bg-gray-800' : 'bg-gray-50/50 dark:bg-gray-700/30'} hover:bg-blue-50/50 dark:hover:bg-blue-900/10 transition-colors group`;
    const cardTypeClass = card.gradingOrg ? 'bg-gradient-to-r from-purple-500 to-purple-600 text-white' : 'bg-gradient-to-r from-gray-400 to-gray-500 text-white';
    
    // 计算各价格（按当前汇率换算）
    // 购入总价 = 购入数量 × 购入单价 × 汇率
    const purchasePriceConverted = (((card.purchasePrice || 0) * (card.purchaseQty || 1)) * getRate(card.purchaseCurrency)).toFixed(0);
    const marketPriceConverted = ((card.marketPrice || 0) * getRate(card.marketCurrency)).toFixed(0);
    const salePriceConverted = ((card.salePrice || 0) * getRate(card.saleCurrency)).toFixed(0);
    
    // 图片占位符 - 显示加载图标
    const imagePlaceholder = card.images && card.images.length > 0 
      ? `<div class="w-7 h-9 bg-gray-200 dark:bg-gray-600 rounded border border-gray-200 dark:border-gray-600 flex items-center justify-center"><i class="fa fa-spinner fa-spin text-gray-400 text-[8px]"></i></div>`
      : (card.image ? `<div class="w-7 h-9 bg-gray-200 dark:bg-gray-600 rounded border border-gray-200 dark:border-gray-600 flex items-center justify-center"><i class="fa fa-spinner fa-spin text-gray-400 text-[8px]"></i></div>` : '<div class="w-7 h-9 bg-gray-100 dark:bg-gray-700 rounded border border-gray-200 dark:border-gray-600 flex items-center justify-center"><i class="fa fa-image text-gray-300 text-[10px]"></i></div>');
    
    tr.innerHTML = `
      <td class="px-2 py-1.5">
        <input type="checkbox" class="card-checkbox rounded text-primary focus:ring-primary cursor-pointer w-3.5 h-3.5" data-id="${originalIndex}" data-tooltip="勾选此卡牌进行批量操作，如批量删除。">
      </td>
      <td class="px-2 py-1.5">
        <div class="flex items-center gap-2">
          ${card.images && card.images.length > 0 ? `<div class="image-placeholder w-7 h-9 rounded border border-gray-200 dark:border-gray-600 overflow-hidden" data-original-index="${originalIndex}">${imagePlaceholder}</div>` : (card.image ? `<div class="image-placeholder w-7 h-9 rounded border border-gray-200 dark:border-gray-600 overflow-hidden" data-original-index="${originalIndex}">${imagePlaceholder}</div>` : imagePlaceholder)}
          <span class="font-medium text-xs card-name-tooltip" data-tooltip="${card.name || '-'}">${(card.name || '').length > 30 ? (card.name || '').substring(0, 30) + '...' : (card.name || '-')}</span>
        </div>
      </td>
      <td class="px-2 py-1.5 text-gray-600 dark:text-gray-400 text-[11px]">${card.series || '-'}</td>
      <td class="px-2 py-1.5 text-gray-600 dark:text-gray-400 text-[11px]">${card.no || '-'}</td>
      <td class="px-2 py-1.5">
        <span class="px-1.5 py-0.5 rounded text-[9px] font-medium ${cardTypeClass}">${card.gradingOrg || '无'}</span>
      </td>
      <td class="px-2 py-1.5">
        <div class="flex flex-wrap gap-0.5">
          ${card.groups && card.groups.length > 0 ? card.groups.slice(0, 2).map(group => `<span class="px-1 py-0.5 rounded text-[9px] font-medium bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300">${group}</span>`).join('') + (card.groups.length > 2 ? `<span class="px-1 py-0.5 rounded text-[9px] font-medium bg-gray-100 text-gray-500">+${card.groups.length - 2}</span>` : '') : '<span class="text-gray-300 text-[10px]">-</span>'}
        </div>
      </td>
      <td class="px-2 py-1.5 text-gray-600 dark:text-gray-400 text-[11px]">${card.language || '-'}</td>
      <td class="px-2 py-1.5 text-gray-600 dark:text-gray-400 text-[11px]">${card.source || '-'}</td>
      <td class="px-2 py-1.5 text-center">
        <button onclick="toggleDeleteMark(${originalIndex})" class="${card.markedForDelete ? 'text-red-500' : 'text-gray-300'} hover:text-red-500 transition-colors" data-tooltip="标记此卡牌为待删除状态，方便后续批量处理。再次点击可取消标记。">
          <i class="fa ${card.markedForDelete ? 'fa-flag' : 'fa-flag-o'} text-[10px]"></i>
        </button>
      </td>
      <td class="px-2 py-1.5 text-[11px] text-right font-medium">${card.qty || 0}</td>
      <td class="px-2 py-1.5 text-[10px] text-right font-medium text-emerald-600 dark:text-emerald-400">${purchasePriceConverted}</td>
      <td class="px-2 py-1.5 text-[10px] text-right font-medium text-blue-600 dark:text-blue-400">${marketPriceConverted}</td>
      <td class="px-2 py-1.5 text-[10px] text-right font-medium text-purple-600 dark:text-purple-400">${salePriceConverted}</td>
      <td class="px-2 py-1.5">
        <div class="flex justify-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
          <button onclick="editCard(${originalIndex})" class="text-blue-500 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20 p-1 rounded transition-colors" data-tooltip="编辑此卡牌的详细信息，如价格、数量、图片等。">
            <i class="fa fa-pencil text-[10px]"></i>
          </button>
          <button onclick="deleteCard(${originalIndex})" class="text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 p-1 rounded transition-colors" data-tooltip="删除此卡牌。删除后可在"已删"中恢复或彻底删除。">
            <i class="fa fa-trash text-[10px]"></i>
          </button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
  
  // 渲染完成后异步加载图片
  loadTableImages();
  
  // 更新统计
  elements.totalCount.textContent = totalQty;
  const convertedTotal = totalValue * rate[currency];
  elements.totalPrice.textContent = convertedTotal.toFixed(2);
  elements.cardListCount.textContent = `(${displayData.length})`;
  elements.curLabel.textContent = currencySymbols[currency];
  
  // 更新已删除卡牌数量
  updateDeletedCount();
  
  // 更新汇率显示
  const exchangeRateEl = document.getElementById('exchangeRate');
  const rateUpdateTimeEl = document.getElementById('rateUpdateTime');
  if (exchangeRateEl && rateUpdateTimeEl) {
    if (currency === 'CNY') {
      exchangeRateEl.textContent = `1 CNY = 1 CNY`;
      rateUpdateTimeEl.textContent = '基准货币：人民币';
    } else {
      exchangeRateEl.textContent = `1 CNY = ${rate[currency].toFixed(3)} ${currency}`;
      rateUpdateTimeEl.textContent = `当前货币：${currency} | 符号：${currencySymbols[currency]}`;
    }
  }
  
  // 绑定复选框事件
  document.querySelectorAll('.card-checkbox').forEach(cb => {
    cb.onchange = function() {
      const id = parseInt(this.dataset.id);
      if (this.checked) {
        selectedCards.add(id);
      } else {
        selectedCards.delete(id);
      }
    };
  });
}

        submittingMethod: document.getElementById('submittingMethod')?.value || '',

// === 切换删除标记 ===
function toggleDeleteMark(index) {
  cards[index].markedForDelete = !cards[index].markedForDelete;
  save();
  render();
  showToast(cards[index].markedForDelete ? '标记' : '取消标记', cards[index].markedForDelete ? '卡牌已标记为待删除' : '已取消删除标记', cards[index].markedForDelete ? 'warning' : 'info');
}

// === 删除卡牌 ===
function deleteCard(index) {
  const card = cards[index];
  
  if (card.markedForDelete) {
    // 如果已经标记为删除，则彻底删除
    if (confirm('【二次确认】该卡牌已标记为待删除，确定要永久删除吗？')) {
      cards.splice(index, 1);
      save();
      render();
      showToast('成功', '卡牌已彻底删除');
    }
  } else {
    // 首次删除，标记为删除状态
    if (confirm('确定要删除这张卡牌吗？删除后可在"已删"中查看和恢复。')) {
      cards[index].markedForDelete = true;
      save();
      render();
      showToast('成功', '卡牌已删除，可在"已删"中查看');
    }
  }
}

// === 空闲检测与虚化效果 ===
(function initIdleBlur() {
  let idleTimer = null;
  const IDLE_TIMEOUT = 30000; // 30秒
  
  // 获取所有需要虚化的元素
  function getBlurElements() {
    return [
      document.querySelector('header'),
      document.querySelector('.main-content'),
      document.querySelector('.desktop-sidebar'),
      document.querySelector('nav.mobile-nav'),
      document.querySelector('.card-list-area')
    ].filter(el => el !== null);
  }
  
  function resetIdleTimer() {
    // 清除之前的定时器
    if (idleTimer) {
      clearTimeout(idleTimer);
    }
    
    // 移除虚化效果
    const elements = getBlurElements();
    elements.forEach(el => {
      el.style.filter = 'none';
      el.style.opacity = '1';
      el.style.transition = 'filter 0.8s ease, opacity 0.8s ease';
    });
    
    // 设置新的定时器
    idleTimer = setTimeout(() => {
      // 只有在有自定义背景时才虚化
      if (localStorage.getItem('tcgCustomBackground')) {
        const elements = getBlurElements();
        elements.forEach(el => {
          el.style.filter = 'blur(12px) brightness(0.6)';
          el.style.opacity = '0.5';
        });
      }
    }, IDLE_TIMEOUT);
  }
  
  // 监听用户交互事件
  const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'];
  events.forEach(event => {
    document.addEventListener(event, resetIdleTimer, true);
  });
  
  // 初始化
  resetIdleTimer();
})();

// === 全局Tooltip提示系统 ===
(function initTooltipSystem() {
  // 创建tooltip元素
  const tooltip = document.createElement('div');
  tooltip.id = 'global-tooltip';
  tooltip.className = 'fixed z-[9999] px-3 py-2 bg-gray-900 dark:bg-gray-800 text-white text-xs rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 max-w-xs whitespace-pre-wrap';
  tooltip.style.cssText = 'top: 0; left: 0;';
  document.body.appendChild(tooltip);

  let tooltipTimer = null;
  let currentTarget = null;

  // 显示tooltip
  function showTooltip(target, content) {
    if (!content) return;
    
    tooltip.textContent = content;
    tooltip.style.opacity = '1';
    
    // 计算位置
    const rect = target.getBoundingClientRect();
    const tooltipRect = tooltip.getBoundingClientRect();
    
    let top = rect.bottom + 8;
    let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
    
    // 边界检查
    if (left < 8) left = 8;
    if (left + tooltipRect.width > window.innerWidth - 8) {
      left = window.innerWidth - tooltipRect.width - 8;
    }
    if (top + tooltipRect.height > window.innerHeight - 8) {
      top = rect.top - tooltipRect.height - 8;
    }
    
    tooltip.style.top = top + 'px';
    tooltip.style.left = left + 'px';
  }

  // 隐藏tooltip
  function hideTooltip() {
    tooltip.style.opacity = '0';
    currentTarget = null;
    if (tooltipTimer) {
      clearTimeout(tooltipTimer);
      tooltipTimer = null;
    }
  }

  // 使用事件委托监听鼠标事件
  document.addEventListener('mouseover', function(e) {
    const target = e.target.closest('[data-tooltip]');
    if (!target || target === currentTarget) return;
    
    currentTarget = target;
    const content = target.getAttribute('data-tooltip');
    
    const delay = target.classList.contains('card-name-tooltip') ? 500 : 3000;
    
    tooltipTimer = setTimeout(() => {
      if (currentTarget === target) {
        showTooltip(target, content);
      }
    }, delay);
  });

  document.addEventListener('mouseout', function(e) {
    const target = e.target.closest('[data-tooltip]');
    if (!target) return;
    
    const relatedTarget = e.relatedTarget;
    if (!relatedTarget || !relatedTarget.closest('[data-tooltip]') || relatedTarget.closest('[data-tooltip]') !== target) {
      hideTooltip();
    }
  });

  // 鼠标移动时更新tooltip位置
  document.addEventListener('mousemove', function(e) {
    if (tooltip.style.opacity === '1' && currentTarget) {
      const rect = currentTarget.getBoundingClientRect();
      const tooltipRect = tooltip.getBoundingClientRect();
      
      let top = rect.bottom + 8;
      let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
      
      if (left < 8) left = 8;
      if (left + tooltipRect.width > window.innerWidth - 8) {
        left = window.innerWidth - tooltipRect.width - 8;
      }
      if (top + tooltipRect.height > window.innerHeight - 8) {
        top = rect.top - tooltipRect.height - 8;
      }
      
      tooltip.style.top = top + 'px';
      tooltip.style.left = left + 'px';
    }
  });

  // 点击时隐藏tooltip
  document.addEventListener('click', hideTooltip);
})();
